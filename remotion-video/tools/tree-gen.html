<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#fff}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------------------------------------------------------------------
// Procedural bare-tree silhouette generator.
//
// Two passes: the tree is first grown in an abstract coordinate space (trunk
// base at the origin, growing along -y) and measured, then fitted into the
// output canvas and drawn. Fitting means the branching parameters can be tuned
// for *shape* without also having to keep the tree inside the frame.
//
// Output is black-on-white, tightly cropped, with the trunk base at (0.5, 1.0)
// of the image — the same convention as the reference stock silhouettes.
// ---------------------------------------------------------------------------

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PRESETS = {
  /**
   * Dense bare oak, after `Untitled_design__2_.png`.
   *
   * Monopodial, not dichotomous: a central leader runs the full height of the
   * tree and laterals come off it in tiers, rather than the trunk forking into
   * equal limbs. That is what gives the reference its straight trunk visible
   * all the way up through the canopy — and, because the laterals arch over
   * without meeting, the large open gaps between them.
   */
  dense: {
    seed: 20240517,
    /** Leader segments from base to tip. */
    leaderSteps: 14,
    /** Leader length per step, as a fraction of the previous step. */
    leaderTaper: 0.93,
    /** Trunk half-width at the base, in leader-step units. */
    trunkWidth: 0.195,
    widthRatio: 0.755,
    /** Wander of the leader, in radians per step. */
    leaderWander: 0.075,
    /** Where along the leader the first lateral appears. */
    firstLateralAt: 0.18,
    /** Lateral length as a multiple of the leader step it grows from. */
    lateralLen: [2.05, 3.25],
    /** Lateral launch angle from vertical: near-horizontal low down, steeper
     *  toward the top, which is what rounds the crown off. */
    lateralAngle: [1.15, 0.42],
    /** Lateral thickness relative to the leader at that height. */
    lateralWidth: 0.74,
    /** Sub-branching within a lateral. */
    depth: 7,
    spread: [0.30, 0.62],
    lenRatio: [0.62, 0.78],
    curve: 0.26,
    upBias: 0.34,
    children: () => 2,
    extraSplit: 0.14,
    drop: 0.16,
    stubChance: 0.14,
    flare: 2.6,
  },
};

// --- pass 1: grow the tree in abstract space -------------------------------
function grow(preset) {
  const p = PRESETS[preset];
  const rnd = mulberry32(p.seed);
  const rr = (a, b) => a + rnd() * (b - a);
  const segs = [];
  const stubs = [];

  const push = (x, y, cx, cy, x1, y1, w0, w1) =>
    segs.push({ x, y, cx, cy, x1, y1, w0, w1 });

  // Sub-branching inside a lateral: this part stays dichotomous, because that
  // is how real twigs divide.
  function twig(x, y, angle, len, width, depth) {
    if (depth <= 0 || len < 0.004) return;

    const bend = rr(-p.curve, p.curve);
    const midAng = angle + bend * 0.5;
    const cx = x + Math.cos(midAng) * len * 0.5;
    const cy = y + Math.sin(midAng) * len * 0.5;
    const endAng = angle + bend;
    const x1 = cx + Math.cos(endAng) * len * 0.5;
    const y1 = cy + Math.sin(endAng) * len * 0.5;
    const w1 = width * p.widthRatio;

    push(x, y, cx, cy, x1, y1, width, w1);

    if (depth > 1 && rnd() < p.stubChance) {
      const sa = endAng + (rnd() < 0.5 ? -1 : 1) * rr(0.75, 1.35);
      const sl = len * rr(0.16, 0.34);
      stubs.push({ x: x1, y: y1, x1: x1 + Math.cos(sa) * sl, y1: y1 + Math.sin(sa) * sl, w: w1 * 0.8 });
    }

    let n = p.children(depth);
    if (rnd() < p.extraSplit) n += 1;
    const spread = rr(p.spread[0], p.spread[1]);
    for (let i = 0; i < n; i++) {
      if (n > 2 && rnd() < p.drop) continue;
      const t = n === 1 ? 0 : i / (n - 1) - 0.5;
      let a = endAng + t * spread * 2 + rr(-0.18, 0.18);
      const bias = p.upBias * (depth / p.depth);
      a += (-Math.PI / 2 - a) * bias * rr(0.4, 1.0);
      twig(x1, y1, a, len * rr(p.lenRatio[0], p.lenRatio[1]), w1, depth - 1);
    }
  }

  // The leader: one continuous axis from base to tip, shedding laterals.
  let x = 0;
  let y = 0;
  let angle = -Math.PI / 2 + rr(-0.03, 0.03);
  let len = 1;
  let width = p.trunkWidth;
  let side = rnd() < 0.5 ? -1 : 1;

  for (let step = 0; step < p.leaderSteps; step++) {
    const t = step / (p.leaderSteps - 1);
    const bend = rr(-p.leaderWander, p.leaderWander);
    const midAng = angle + bend * 0.5;
    const cx = x + Math.cos(midAng) * len * 0.5;
    const cy = y + Math.sin(midAng) * len * 0.5;
    const endAng = angle + bend;
    const x1 = cx + Math.cos(endAng) * len * 0.5;
    const y1 = cy + Math.sin(endAng) * len * 0.5;
    const w1 = width * p.leaderTaper;

    push(x, y, cx, cy, x1, y1, width, w1);

    if (t >= p.firstLateralAt) {
      // Laterals alternate sides, the way a real leader sheds them, with the
      // launch angle steepening toward the top to round the crown.
      const n = rnd() < 0.55 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const dir = i === 0 ? side : -side;
        const flat = p.lateralAngle[0] + (p.lateralAngle[1] - p.lateralAngle[0]) * t;
        const a = -Math.PI / 2 + dir * (flat + rr(-0.16, 0.16));
        const l = len * rr(p.lateralLen[0], p.lateralLen[1]);
        twig(x1, y1, a, l, w1 * p.lateralWidth, p.depth);
      }
    }
    side = -side;

    x = x1;
    y = y1;
    angle = endAng;
    len *= p.leaderTaper;
    width = w1;
  }

  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  const acc = (px, py, w) => {
    if (px - w < minX) minX = px - w;
    if (px + w > maxX) maxX = px + w;
    if (py - w < minY) minY = py - w;
    if (py + w > maxY) maxY = py + w;
  };
  for (const sg of segs) { acc(sg.x, sg.y, sg.w0); acc(sg.cx, sg.cy, sg.w0); acc(sg.x1, sg.y1, sg.w1); }
  for (const sg of stubs) { acc(sg.x, sg.y, sg.w); acc(sg.x1, sg.y1, sg.w); }
  acc(0, 0, p.trunkWidth * p.flare);

  return { p, segs, stubs, bbox: { minX, maxX, minY, maxY } };
}

// --- pass 2: fit and draw ---------------------------------------------------
window.renderTree = function (preset, maxSize) {
  const { p, segs, stubs, bbox } = grow(preset);

  // Symmetrise horizontally around the trunk base so the base lands at x=0.5.
  const half = Math.max(-bbox.minX, bbox.maxX);
  const treeW = half * 2;
  const treeH = -bbox.minY;
  const scale = maxSize / Math.max(treeW, treeH);
  const margin = Math.round(maxSize * 0.012);
  const W = Math.round(treeW * scale) + margin * 2;
  const H = Math.round(treeH * scale) + margin * 2;

  const c = document.getElementById("c");
  c.width = W;
  c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H - margin);
  ctx.scale(scale, scale);
  ctx.fillStyle = "#000";
  ctx.strokeStyle = "#000";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const hairline = 0.55 / scale; // ~0.55 device px: fine twigs the fog can catch

  for (const s of segs) {
    if (s.w0 * scale > 0.9) {
      const ang = Math.atan2(s.y1 - s.y, s.x1 - s.x);
      const nx = Math.cos(ang + Math.PI / 2);
      const ny = Math.sin(ang + Math.PI / 2);
      const wm = (s.w0 + s.w1) / 2;
      ctx.beginPath();
      ctx.moveTo(s.x + nx * s.w0, s.y + ny * s.w0);
      ctx.quadraticCurveTo(s.cx + nx * wm, s.cy + ny * wm, s.x1 + nx * s.w1, s.y1 + ny * s.w1);
      ctx.lineTo(s.x1 - nx * s.w1, s.y1 - ny * s.w1);
      ctx.quadraticCurveTo(s.cx - nx * wm, s.cy - ny * wm, s.x - nx * s.w0, s.y - ny * s.w0);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.lineWidth = Math.max(hairline, (s.w0 + s.w1));
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.quadraticCurveTo(s.cx, s.cy, s.x1, s.y1);
      ctx.stroke();
    }
  }
  for (const s of stubs) {
    ctx.lineWidth = Math.max(hairline, s.w * 1.6);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x1, s.y1);
    ctx.stroke();
  }

  // Root flare where the trunk meets the ground.
  const tw = p.trunkWidth;
  ctx.beginPath();
  ctx.moveTo(-tw * p.flare, 0);
  ctx.quadraticCurveTo(-tw * 1.05, -tw * 1.4, -tw, -tw * 3.0);
  ctx.lineTo(tw, -tw * 3.0);
  ctx.quadraticCurveTo(tw * 1.05, -tw * 1.4, tw * p.flare, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  document.title = "ready:" + W + "x" + H;
  return { width: W, height: H };
};
</script>
</body>
</html>
